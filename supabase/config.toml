# Supabase CLI project config.
#
# Committed so `supabase link` works straight after a clone — without this file
# the CLI does not consider the directory a project and refuses to link.
#
# Deliberately minimal. The CLI's `supabase init` writes ~200 lines covering
# local Studio ports, inbucket, realtime and analytics, none of which this
# project uses: migrations are applied to the hosted project with `db push`, and
# the RLS proof boots its own throwaway Postgres (scripts/verify-rls.sh).

project_id = "ninety"

[db]
# The port the local `supabase start` stack would use. Only relevant if you run
# the full local stack; nothing in this repo requires it.
port = 54322

# Match this to your hosted project's Postgres version, which is shown in the
# dashboard under Settings → Database → Infrastructure. It only affects a local
# `supabase start`; `db push` uses whatever the hosted project runs.
major_version = 17

# ─── Edge Functions ─────────────────────────────────────────────────────────
# `estimate-meal` is P1-F's photo route. The model API key lives in its
# environment and nowhere else (§04) — see supabase/functions/README.md for the
# secrets it needs and how to set them.

[functions.estimate-meal]
# On, and it is load-bearing rather than a default left alone. The function
# reads a private Storage object under the service role, so the identity it
# scopes that read to has to be a verified one; with this off, `getUser()` would
# be reading an unverified token.
verify_jwt = true
