<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=B612+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #060606; }
    a { color: #FFB000; } a:hover { color: #FFC54D; }
    @keyframes flapIn { 0% { transform: rotateX(-88deg); } 60% { transform: rotateX(14deg); } 100% { transform: rotateX(0); } }
  </style>
</helmet>
<div style="width: 393px; height: 852px; background: #060606; color: #EDE6DA; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: 1; display: flex; flex-direction: column; padding: 54px 20px 0; min-height: 0;">

    <!-- board header -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1F1F1F; padding-bottom: 10px;">
      <div style="font-size: 16px; font-weight: 700; letter-spacing: 3px;">RANK</div>
      <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 9px; color: #877D70; letter-spacing: 1px;">WEEK OF 03 AUG · WK 32</div>
    </div>

    <!-- tier: the word itself on flap tiles — colour-independent by nature -->
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px;">
      <div style="display: flex; gap: 5px; perspective: 600px;">
        <div style="width: 56px; height: 74px; background: linear-gradient(180deg, #1A1A1A 0%, #1A1A1A 48%, #0B0B0B 52%, #141414 100%); border: 1px solid #242424; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 40px; font-weight: 700; color: #FFB000;">G</div>
        <div style="width: 56px; height: 74px; background: linear-gradient(180deg, #1A1A1A 0%, #1A1A1A 48%, #0B0B0B 52%, #141414 100%); border: 1px solid #242424; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 40px; font-weight: 700; color: #FFB000;">O</div>
        <div style="width: 56px; height: 74px; background: linear-gradient(180deg, #1A1A1A 0%, #1A1A1A 48%, #0B0B0B 52%, #141414 100%); border: 1px solid #242424; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 40px; font-weight: 700; color: #FFB000;">L</div>
        <div style="width: 56px; height: 74px; background: linear-gradient(180deg, #1A1A1A 0%, #1A1A1A 48%, #0B0B0B 52%, #141414 100%); border: 1px solid #242424; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 40px; font-weight: 700; color: #FFB000;">D</div>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-left: 8px;">
          <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 9px; color: #877D70;">TIER 3 OF 5</div>
          <div style="font-size: 12.5px; font-weight: 600; color: #58C88A; letter-spacing: 0.5px; white-space: nowrap;">▲ UP FROM SILVER</div>
        </div>
      </div>
    </div>

    <!-- composite: the big board row, flap-animated -->
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 22px;">
      <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 9px; color: #877D70; letter-spacing: 1px;">COMPOSITE · THIS WEEK</div>
      <div style="display: flex; gap: 6px; align-items: flex-end; perspective: 700px;">
        <div style="width: 74px; height: 104px; background: linear-gradient(180deg, #1C1C1C 0%, #1C1C1C 48%, #0A0A0A 52%, #151515 100%); border: 1px solid #262626; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 62px; font-weight: 700; color: #EDE6DA; transform-origin: center top; animation: flapIn 500ms 100ms cubic-bezier(0.3, 0, 0.4, 1) backwards;">0</div>
        <div style="width: 20px; height: 104px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px;"><div style="width: 9px; height: 9px; background: #FFB000; border-radius: 2px;"></div></div>
        <div style="width: 74px; height: 104px; background: linear-gradient(180deg, #1C1C1C 0%, #1C1C1C 48%, #0A0A0A 52%, #151515 100%); border: 1px solid #262626; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 62px; font-weight: 700; color: #EDE6DA; transform-origin: center top; animation: flapIn 500ms 240ms cubic-bezier(0.3, 0, 0.4, 1) backwards;">7</div>
        <div style="width: 74px; height: 104px; background: linear-gradient(180deg, #1C1C1C 0%, #1C1C1C 48%, #0A0A0A 52%, #151515 100%); border: 1px solid #262626; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 62px; font-weight: 700; color: #EDE6DA; transform-origin: center top; animation: flapIn 500ms 380ms cubic-bezier(0.3, 0, 0.4, 1) backwards;">1</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; padding-left: 6px; padding-bottom: 8px;">
          <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 9px; color: #877D70;">HOLDS</div>
          <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 15px; font-weight: 700; color: #FFB000;">0.65</div>
        </div>
      </div>
    </div>

    <!-- breakdown: departures table, weights as a board column -->
    <div style="display: flex; flex-direction: column; margin-top: 24px;">
      <div style="display: grid; grid-template-columns: 1fr 52px 76px; gap: 8px; padding: 8px 0; border-top: 2px solid #1F1F1F; border-bottom: 1px solid #1A1A1A;">
        <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 8px; color: #877D70; letter-spacing: 1px;">COMPONENT</div>
        <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 8px; color: #877D70; letter-spacing: 1px; text-align: right;">WT</div>
        <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 8px; color: #877D70; letter-spacing: 1px; text-align: right;">SCORE</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 52px 76px; gap: 8px; align-items: center; padding: 11px 0; border-bottom: 1px solid #1A1A1A;">
        <div style="font-size: 18px; font-weight: 600; letter-spacing: 1.5px;">CONSISTENCY</div>
        <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 12px; color: #A39B8E; text-align: right;">.50</div>
        <div style="display: flex; justify-content: flex-end;"><div style="min-width: 62px; padding: 5px 8px; background: linear-gradient(180deg, #191919 0%, #191919 48%, #0B0B0B 52%, #131313 100%); border: 1px solid #242424; border-radius: 3px; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 16px; font-weight: 700; color: #FFB000; text-align: center;">0.86</div></div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 52px 76px; gap: 8px; align-items: center; padding: 11px 0; border-bottom: 1px solid #1A1A1A;">
        <div style="font-size: 18px; font-weight: 600; letter-spacing: 1.5px;">ADHERENCE</div>
        <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 12px; color: #A39B8E; text-align: right;">.25</div>
        <div style="display: flex; justify-content: flex-end;"><div style="min-width: 62px; padding: 5px 8px; background: linear-gradient(180deg, #191919 0%, #191919 48%, #0B0B0B 52%, #131313 100%); border: 1px solid #242424; border-radius: 3px; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 16px; font-weight: 700; color: #EDE6DA; text-align: center;">0.71</div></div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 52px 76px; gap: 8px; align-items: center; padding: 11px 0; border-bottom: 1px solid #1A1A1A;">
        <div style="font-size: 18px; font-weight: 600; letter-spacing: 1.5px;">PROGRESS</div>
        <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 12px; color: #A39B8E; text-align: right;">.25</div>
        <div style="display: flex; justify-content: flex-end;"><div style="min-width: 62px; padding: 5px 8px; background: linear-gradient(180deg, #191919 0%, #191919 48%, #0B0B0B 52%, #131313 100%); border: 1px solid #242424; border-radius: 3px; font-family: 'B612 Mono', ui-monospace, monospace; font-size: 16px; font-weight: 700; color: #EDE6DA; text-align: center;">0.52</div></div>
      </div>
    </div>

    <!-- ticker: next step -->
    <div style="margin-top: 26px; border: 1px solid #242424; border-radius: 4px; background: #0C0C0C; padding: 12px 14px; display: flex; align-items: center; gap: 10px;">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #FFB000; flex-shrink: 0;"></div>
      <div style="font-size: 15px; font-weight: 500; color: #C6BDAE; letter-spacing: 0.4px;">One more logged day next week keeps Gold.</div>
    </div>
  </div>

  <!-- tab bar -->
  <div style="height: 86px; border-top: 2px solid #1F1F1F; display: flex; align-items: flex-start; padding: 12px 30px 0;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="#877D70" stroke-width="1.5"></circle><path d="M10 6v4l2.5 2.5" stroke="#877D70" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 1.5px; color: #877D70;">TODAY</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="#877D70" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 1.5px; color: #877D70;">LOG</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 16V9M10 16V4M16 16v-5" stroke="#FFB000" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <div style="font-family: 'B612 Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 1.5px; color: #FFB000;">RANK</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
