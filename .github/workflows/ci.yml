name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Private repos get 2,000 free Actions minutes/month, but macOS runners bill at a
# 10× multiplier — so 200 real minutes. Everything that can run on Ubuntu does,
# and the macOS job is gated behind a path filter so documentation and design
# commits never spend the expensive budget.

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Does this change need a Mac? Two seconds on Ubuntu to decide, so that a
  # docs or design commit never starts a macOS runner at all. The probe inside
  # the swift job below could only skip its *steps* — by which point the
  # expensive runner has already been billed.
  # ───────────────────────────────────────────────────────────────────────────
  triage:
    name: Does this touch Swift?
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      sql: ${{ steps.filter.outputs.sql }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare against the base
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # workflow_dispatch, a new branch, or a force-push leaves no usable
          # base. Run the Mac rather than guess — a false negative here means a
          # broken build merges, which costs far more than one macOS minute.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit — running the macOS job."
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          # The paths that can change what the app compiles to. The generated
          # Swift is in here because a token edit regenerates it, and the
          # workflow is in here because a change to this filter must be able to
          # test itself.
          if echo "$changed" | grep -qE '^(Ninety/|NinetyTests/|Packages/|Config/|Ninety\.xcodeproj/|design/generated/.*\.swift|\.swiftlint\.yml|\.github/workflows/)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
            echo "Docs or design only — skipping the macOS job (200 real minutes/month)."
          fi

          # The RLS proof needs a Postgres, not a Mac, so it is gated
          # separately and runs on Ubuntu.
          if echo "$changed" | grep -qE '^(supabase/|scripts/verify-rls\.sh|\.github/workflows/)'; then
            echo "sql=true" >> "$GITHUB_OUTPUT"
          else
            echo "sql=false" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Cheap Ubuntu checks. These run on every push and are the ones that will
  # actually catch things during Phase 0, when there is no Swift code yet.
  # ───────────────────────────────────────────────────────────────────────────
  checks:
    name: Tokens, docs and spike harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate design tokens
        # The tokens JSON is the source of truth for the design system. If it
        # stops parsing, or the generated Swift drifts from it, the whole
        # "tokens are the single source of colour" SwiftLint rule is a lie.
        run: python3 design/tokens/generate.py --check

      - name: Vision harness self-test
        # Spike B runs against a deterministic mock provider here — no API key,
        # no cost, no network. Proves the downscale → call → score → report
        # pipeline is intact so a real run against 20 meals cannot fail on
        # plumbing.
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -r spikes/vision-accuracy/requirements.txt
          python3 -m pytest spikes/vision-accuracy/tests -q

      - name: Check the app bundle's plist
        # Needs no Mac, and catches a class of failure that otherwise only
        # appears at install time on a device or simulator.
        run: python3 scripts/check_bundle.py .

      - name: Check Swift and Postgres still agree
        # Both sides store these enums as the same bare strings, so a value in
        # one and not the other is a row that writes fine and fails to read
        # back. Swift cannot catch it — the mapping is a string, and a string
        # always compiles.
        run: python3 scripts/check_schema_parity.py

      - name: Check for TODO markers in shipped docs
        # Phase 0 deliverables have placeholders you are meant to fill in by
        # hand (competitor numbers, the measured baseline). This does not fail
        # the build — it prints what is still outstanding.
        continue-on-error: true
        run: |
          echo "Outstanding Phase 0 placeholders:"
          grep -rn "TO BE MEASURED\|TBD" docs/ || echo "  none"

  # ───────────────────────────────────────────────────────────────────────────
  # RLS is the security boundary for special category health data (ADR 0003),
  # so "we tested it once in the dashboard" is not a control. This runs the
  # two-account proof against a real Postgres on every change to the schema.
  # ───────────────────────────────────────────────────────────────────────────
  rls:
    name: RLS, proven with two accounts
    runs-on: ubuntu-latest
    needs: triage
    if: needs.triage.outputs.sql == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16

      - name: Apply the migrations and try to breach them
        run: scripts/verify-rls.sh

  # ───────────────────────────────────────────────────────────────────────────
  # Expensive macOS job. Skipped entirely until there is Swift code to check.
  # ───────────────────────────────────────────────────────────────────────────
  swift:
    name: SwiftLint and tests
    runs-on: macos-15
    needs: triage
    if: needs.triage.outputs.swift == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Select toolchain
        # Xcode 26+ against the iOS 26 SDK is the App Store submission floor
        # since 28 April 2026 (§0.1). Pin it rather than trusting the runner
        # default, which moves without warning.
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "::warning::Xcode 26.6 not on this runner image; using default."
          fi
          xcodebuild -version
          swift --version

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict --reporter github-actions-logging

      - name: Prove the guardrails fire
        # The custom rules in .swiftlint.yml are how ADR 0006's engine purity and
        # S5's copy ban are enforced rather than remembered. This runs each of
        # them against a deliberate violation and fails if one gets through — a
        # lint rule that has silently stopped matching looks exactly like a
        # codebase with no violations.
        run: scripts/verify-guardrails.sh

      - name: Test RankingEngine
        # The engine is a standalone SPM package with no UI dependencies, so it
        # tests on the command line without a simulator — which is exactly why
        # §2.1 wants it isolated. This job stays fast for the whole project.
        if: hashFiles('Packages/RankingEngine/Package.swift') != ''
        run: swift test --package-path Packages/RankingEngine

      - name: Build app
        if: hashFiles('Ninety.xcodeproj/project.pbxproj') != ''
        run: |
          xcodebuild build \
            -scheme Ninety \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
